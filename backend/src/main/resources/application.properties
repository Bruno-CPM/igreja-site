# Nome da aplicacao
spring.application.name=igreja-site-api
server.port=8080

# Banco H2 em arquivo (fica salvo em ./data/igreja.mv.db)
spring.datasource.url=jdbc:h2:file:./data/igreja;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Console do H2 (acessivel em http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# URL do frontend liberada no CORS
app.frontend-url=http://localhost:3000
